<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AcePlanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              skin: {
                base: 'var(--color-base)',
                card: 'var(--color-card)',
                text: 'var(--color-text-base)',
                muted: 'var(--color-text-muted)',
                border: 'var(--color-border)',
                'button-hover': 'var(--color-button-hover)',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.2s ease-in-out',
              'fade-in-up': 'fadeInUp 0.3s ease-out',
              'fade-in-down': 'fadeInDown 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInDown: {
                '0%': { opacity: '0', transform: 'translateY(-10px) translateX(-50%)' },
                '100%': { opacity: '1', transform: 'translateY(0) translateX(-50%)' },
              },
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Theme Variables */
      :root {
        --color-base: #f9fafb; /* gray-50 */
        --color-card: #ffffff; /* white */
        --color-text-base: #1f2937; /* gray-800 */
        --color-text-muted: #6b7280; /* gray-500 */
        --color-border: #f3f4f6; /* gray-100 */
        --color-button-hover: #f3f4f6;
      }

      .theme-dark {
        --color-base: #0f172a; /* slate-900 */
        --color-card: #1e293b; /* slate-800 */
        --color-text-base: #f1f5f9; /* slate-100 */
        --color-text-muted: #94a3b8; /* slate-400 */
        --color-border: #334155; /* slate-700 */
        --color-button-hover: #334155;
      }

      .theme-reading {
        --color-base: #fcf6e5; /* warm beige */
        --color-card: #fdfbf7; /* lighter beige */
        --color-text-base: #4a4036; /* dark brown */
        --color-text-muted: #8c8070; /* muted brown */
        --color-border: #e6e0d4; 
        --color-button-hover: #e6e0d4;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs"
  }
}
</script>
</head>
  <body class="bg-gray-100 text-slate-900">
    <div id="root"></div>
  </body>
</html>
